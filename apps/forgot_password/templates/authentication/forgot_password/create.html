<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Quên mật khẩu</title>
</head>
<body>
  <h1>Quên mật khẩu</h1>
  <p>Nhập email của bạn, chúng tôi sẽ gửi mã xác nhận.</p>
  <form method="post">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Email của bạn" required>
    <button type="submit">Gửi mã xác nhận</button>
  </form>
</body>
</html>
