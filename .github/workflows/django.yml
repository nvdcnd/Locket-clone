name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DJANGO_SETTINGS_MODULE: config.settings.development
  SECRET_KEY: ci-only-secret-key-not-for-production
  DEBUG: "False"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migrations must be committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --noinput -v 2

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t locket:ci .

      - name: Smoke test container
        run: |
          docker run -d --name locket -p 10000:10000 \
            -e DJANGO_SETTINGS_MODULE=config.settings.development \
            -e DEBUG=False \
            locket:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:10000/health/; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs locket; exit 1

      - name: Container logs
        if: always()
        run: docker logs locket || true
