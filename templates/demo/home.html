<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <title>Document</title>
    <style>
        body{
            background-color: #121212;
        }
        @media (max-width:768px) {
            .mobile-navbar{
                position: fixed;
                bottom: 0;
                left: 0; /* Đảm bảo căn từ mép trái */
                width: 100%; /* Trải dài hết chiều ngang (nếu muốn) */
                z-index: 1000;
            }
            .navbar{
                margin-bottom: 20px;
                width: 100%;
            }
            .navbar-content{
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .navbar-body{
                width: 60%;
                height: 80px;

                position: fixed;
                bottom: 15px;
                left: 50%;
                transform: translateX(-50%);

                border-radius: 40px; 
                padding: 0 30px;

                background-color: rgba(255, 184, 0, 0.08);
                -webkit-backdrop-filter: blur(25px) saturate(200%);
                backdrop-filter: blur(25px) saturate(200%);
                border: 1px solid rgba(255, 255, 255, 0.3);
                box-shadow: 
                    0 20px 50px rgba(0, 0, 0, 0.5),
                    inset 0 1px 1px rgba(255, 255, 255, 0.4),
                    inset 0 -1px 2px rgba(255, 184, 0, 0.2);

                color: #ffffff;
                text-align: center;
                
                /* Hiệu ứng mượt mà khi tương tác */
                transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                            box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
                cursor: pointer;
            }
            .navbar-body ul{
                display: flex;
                justify-content: center; /* Phân bổ 3 nút sang 2 bên và giữa */
                align-items: center;
                width: 100%;
                height: 100%;
                gap:50px;
                padding: 0;
                margin: 0;
                list-style: none;
            }
            .navbar-body ul li{
                list-style-type: none;
            }
            .navbar-body ul li:not(:nth-child(2)) {
                font-size: 1.5rem; /* Tăng kích thước nếu dùng Font Icon (FontAwesome, Lucide...) */
                cursor: pointer;
            }


                /* Hiệu ứng hover cho 2 nút 2 bên */
            .navbar-body ul li:not(:nth-child(2)):hover {
                transform: scale(1.01); /* Phóng to nhẹ khi di chuột vào */
                opacity: 0.9;
            }
            .navbar-body ul li:nth-child(2) {
                /* Tăng kích thước khung chứa icon ở giữa */
                width: 50px;
                height: 50px;

                
                /* Bo tròn hoàn hảo */
                border-radius: 50%;
                
                /* Đổi màu nền & viền cho nổi bật (Màu vàng Locket) */
                background: transparent;
                border: solid 2px #FFB800;
                color: #000000; /* Đổi màu icon bên trong thành màu đen */
                
                /* Đổ bóng hiệu ứng phát sáng */
                box-shadow: 0 0 20px rgba(255, 184, 0, 0.5);

                /* Giúp icon bên trong tự động căn chính giữa khung tròn */
                display: flex;
                align-items: center;
                justify-content: center;

                /* Đẩy nhẹ nút lên trên nếu muốn tạo hiệu ứng nhô cao */ 
                
                transition: all 0.2s ease;
            }

                /* 2. Tăng kích thước bản thân cái SVG/Icon tròn bên trong (nếu cần) */

                /* Hiệu ứng phóng to khi hover vào nút giữa */
            .navbar-body ul li:nth-child(2):hover {
                transform: translateY(-6px) scale(1.1);
                box-shadow: 0 0 25px rgba(255, 184, 0, 0.7);
            }
        }
        .topbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            width: 100vw;
        }

        .top-bar-left,
        .top-bar-right {
            flex: 1; /* Tự động phình ra để chiếm diện tích cân bằng 2 bên */
            display: flex;
            align-items: center;
        }

        .top-bar-left {
            justify-content: flex-start;
        }

        .top-bar-right {
            justify-content: flex-end; /* Đẩy nút Chat sát mép phải */
        }

            /* Khối Trung Tâm */
        .top-bar-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dropdown-toggle{
            width: 50vw;
            height: 38px;
            padding: 20px;
            background-color: rgba(255, 184, 0, 0.08);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                inset 0 -1px 2px rgba(255, 184, 0, 0.2);
            color: #ffffff;
            border-radius: 19px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        .dropdown-toggle:hover{
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }
        .topbar-right{
            color:white;
        }
    </style>
</head>
<body>
    <section class="topbar">
        <div class="topbar-content">
            <div class="topbar-left"></div>
            <div class="topbar-center">
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Dropdown button
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                </div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-primary btn-round">
                    <i class="bi bi-chat"></i>
                </button>
            </div>
        </div>
    </section>
    <section class="mobile-navbar">
        <div class="navbar">
            <div class="navbar-content">
                <div class="navbar-body">
                    <ul>
                        <li>
                            <i class="bi bi-grid-3x2-gap"></i>
                        </li>
                        <li>                            
                        </li>
                        <li>
                            <i class="bi bi-upload"></i>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
